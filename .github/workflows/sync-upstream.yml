name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/abbodi1406/BatUtil.git 2>/dev/null || git remote set-url upstream https://github.com/abbodi1406/BatUtil.git
          git fetch upstream master

      - name: Apply missing upstream commits
        run: |
          git config user.name 'Github Actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The local history is a rewritten copy of upstream (translated and
          # with translated commit messages). Identify upstream commits that
          # are not present locally by matching subject + author date.
          git log --format='%s%x09%ad' --date=raw HEAD > "$RUNNER_TEMP/local-keys"
          missing=()
          while IFS=$'\t' read -r sha subject date; do
            key="${subject}"$'\t'"${date}"
            if ! grep -Fqx -- "$key" "$RUNNER_TEMP/local-keys"; then
              missing+=("$sha")
            fi
          done < <(git log --reverse --format='%H%x09%s%x09%ad' --date=raw upstream/master)

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "No missing upstream commits."
            exit 0
          fi

          for sha in "${missing[@]}"; do
            echo "Applying upstream commit $sha"
            if ! git cherry-pick --no-commit "$sha"; then
              echo "::warning::Conflict while applying upstream commit $sha; keeping the upstream side."
              if ! python3 .github/scripts/resolve-translation-conflicts.py; then
                echo "::error::Could not resolve conflict for upstream commit $sha."
                git status --short
                exit 1
              fi
              git add -A
              git commit -C "$sha" --author='Github Actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
            else
              git commit -C "$sha" --author='Github Actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
            fi
          done

      - name: Push synced history
        run: |
          ahead=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "Nothing to push."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream commit key list
        run: |
          git remote add upstream https://github.com/abbodi1406/BatUtil.git 2>/dev/null || git remote set-url upstream https://github.com/abbodi1406/BatUtil.git
          git fetch upstream master
          git log --format='%s%x09%ad' --date=raw upstream/master > "$RUNNER_TEMP/upstream-keys"

      - name: Sync upstream metadata
        env:
          UPSTREAM_KEYS: ${{ runner.temp }}/upstream-keys
        run: |
          cat > "$RUNNER_TEMP/filter-author.sh" <<'SH'
          #!/bin/sh
          key=$(git log -1 --format='%s%x09%ad' --date=raw "$GIT_COMMIT")
          if grep -Fqx "$key" "$UPSTREAM_KEYS"; then
            export GIT_AUTHOR_NAME='Github Actions[bot]'
            export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            export GIT_COMMITTER_NAME='Github Actions[bot]'
            export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          fi
          SH
          chmod +x "$RUNNER_TEMP/filter-author.sh"
          git config user.name 'Github Actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter ". '$RUNNER_TEMP/filter-author.sh'" -- "${GITHUB_REF_NAME}"
          git for-each-ref --format='%(refname)' refs/original | xargs -r -n1 git update-ref -d
          git reflog expire --expire=now --all
          git gc --prune=now

      - name: Push rewritten history
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --force-with-lease
